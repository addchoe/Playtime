<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playtime!</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #EEEEEE;
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-weight: 400;
      font-size: 18px;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── FIXED 1920×1080 DESIGN CANVAS, SCALED TO FIT THE WINDOW ── */
    .viewport-scale {
      position: relative;
      width: 1920px;
      height: 1080px;
      flex-shrink: 0;
      background-color: #EEEEEE;
      transform: scale(1);
      transform-origin: center center;
      overflow: hidden;
    }

    /* ── LOGO ── */
    .site-logo {
      position: fixed;
      top: 29px;
      left: 60px;
      z-index: 100;
      width: 144px;
      height: 36px;
      display: flex;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
    }
    .site-logo img {
      width: 144px;
      height: 36px;
      object-fit: contain;
      object-position: left center;
    }

    /* ── OVERLAY ── */
    .nav-overlay {
      position: fixed;
      inset: 0;
      background: rgba(17,17,17,0.4);
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .nav-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── NAV PILL ── */
    .nav-pill {
      position: fixed;
      top: 29px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: #111111;
      overflow: hidden;

      /* closed state */
      width: 411px;
      height: 36px;
      border-radius: 18px;

      transition:
        width        0.42s cubic-bezier(0.4, 0, 0.2, 1),
        height       0.42s cubic-bezier(0.4, 0, 0.2, 1),
        border-radius 0.42s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-pill.open {
      width: 411px;
      height: 395px;
      border-radius: 18px;
    }

    /* ── TOP BAR ── */
    .nav-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 36px;
      padding: 0 31px;
      cursor: pointer;
    }

    /* closed row: Time + clock */
    .nav-top-closed {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 31px;
      transition: opacity 0.15s ease;
    }

    /* open row: Time + Close */
    .nav-top-open {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 31px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .nav-pill.open .nav-top-closed { opacity: 0; pointer-events: none; }
    .nav-pill.open .nav-top-open   { opacity: 1; pointer-events: auto; }

    .nav-label {
      font-family: 'Pretendard', sans-serif;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: -0.04em;
      color: rgba(238,238,238,0.45);
      user-select: none;
    }

    .nav-time {
      font-family: 'Pretendard', sans-serif;
      font-weight: 400;
      font-size: 18px;
      color: #EEEEEE;
    }

    .nav-close {
      font-family: 'Pretendard', sans-serif;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: -0.04em;
      color: rgba(238,238,238,0.45);
      cursor: pointer;
    }
    .nav-close:hover { color: #EEEEEE; }

    /* ── EXPANDED CONTENT ── */
    .nav-body {
      position: absolute;
      top: 36px; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0 20px 9px 27px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .nav-pill.open .nav-body {
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.2s ease 0.25s;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 11px;
      padding-top: 42px;
      padding-left: 12px;
    }

    .nav-menu-item {
      font-family: 'SK Concretica', 'Pretendard', sans-serif;
      font-weight: 400;
      font-size: 30px;
      letter-spacing: -0.02em;
      color: #EEEEEE;
      text-decoration: none;
      cursor: pointer;
      line-height: 1.2;
      transition: opacity 0.15s;
    }
    .nav-menu-item:hover { opacity: 0.5; }

    .nav-thumb-preview {
      position: absolute;
      right: 20px;
      width: 97px;
      height: 60px;
      border-radius: 6px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .nav-thumb-preview.visible {
      opacity: 1;
      transform: scale(1);
    }
    .nav-thumb-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nav-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .nav-copyright {
      font-family: 'Pretendard', sans-serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: -0.04em;
      color: rgba(238,238,238,0.45);
      padding-bottom: 12px;
    }

    .nav-icons {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-right: 0;
    }

    .nav-icon-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 43px;
      height: 42px;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.15s;
    }
    .nav-icon-link:hover { opacity: 1; }
    .nav-icon-link img {
      width: 39px;
      height: 38px;
      object-fit: contain;
    }

    /* ── CONTACT BUTTON ── */
    .contact-btn {
      position: fixed;
      top: 29px;
      right: 60px;
      z-index: 100;
      width: 114px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: #E2E2E2;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .contact-btn:hover { background: #D5D5D5; }
    .contact-btn.active { background: #111111; }
    .contact-btn.active .contact-dot { background: #EEEEEE; }
    .contact-btn.active .contact-label { color: #EEEEEE; }

    .contact-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #111111;
      flex-shrink: 0;
    }
    .contact-label {
      font-family: 'Pretendard', sans-serif;
      font-weight: 500;
      font-size: 18px;
      color: #111111;
    }

    /* ── PAGES ── */
    .page { display: none; min-height: 100%; }
    .page.active { display: flex; flex-direction: column; }
    #page-main { align-items: center; justify-content: center; }

    #page-contact { align-items: center; justify-content: center; gap: 48px; }
    .contact-heading {
      font-family: 'Pretendard', sans-serif;
      font-weight: 500;
      font-size: 64px;
      color: #111111;
      text-align: center;
      line-height: 1.1;
    }
    .contact-list { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .contact-item {
      font-family: 'Pretendard', sans-serif;
      font-weight: 500;
      font-size: 18px;
      color: #111111;
      text-decoration: none;
      opacity: 0.35;
      transition: opacity 0.2s;
    }
    .contact-item:hover { opacity: 1; }

    /* ── WALK PAGE (MAZE GAME) — matches Figma "03_Take a Walk" ── */
    #page-walk { display: none; }
    #page-walk.active { display: block; position: absolute; inset: 0; }

    .walk-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 140px 260px 100px;
    }

    .maze-wrap {
      position: relative;
      flex-shrink: 0;
    }

    #maze-canvas {
      display: block;
    }

    .walk-start,
    .walk-end {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transform: translateY(-50%);
    }

    .walk-start { left: -210px; width: 190px; }
    .walk-end { right: -110px; width: 90px; }

    .dog-icon-svg { width: 108px; height: 51px; }

    .start-btn {
      font-family: 'Pretendard', sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: -0.04em;
      line-height: 1.6;
      color: #111111;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.15s;
    }
    .start-btn:hover { opacity: 0.6; }
    .walk-start.hidden { opacity: 0; pointer-events: none; }

    .walk-end-label {
      font-family: 'Pretendard', sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: -0.04em;
      line-height: 1.6;
      color: #111111;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tri-icon { width: 12px; height: 14px; flex-shrink: 0; }

    .walk-footprints {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .paw {
      position: absolute;
      width: 19px;
      height: 20px;
      margin: -10px 0 0 -9.5px;
      opacity: 0.9;
      animation: pawFade 5s ease forwards;
    }
    .paw img { width: 100%; height: 100%; display: block; }

    @keyframes pawFade {
      0%   { opacity: 0.9; }
      75%  { opacity: 0.9; }
      100% { opacity: 0; }
    }

    .walk-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(238,238,238,0.92);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .walk-overlay.show { opacity: 1; pointer-events: auto; }

    .walk-overlay-msg {
      font-family: 'Pretendard', sans-serif;
      font-weight: 600;
      font-size: 24px;
      color: #111111;
      text-align: center;
    }

    .walk-retry {
      font-family: 'Pretendard', sans-serif;
      font-weight: 500;
      font-size: 14px;
      color: #EEEEEE;
      background: #111111;
      border: none;
      border-radius: 999px;
      padding: 10px 24px;
      cursor: pointer;
    }
    .walk-retry:hover { opacity: 0.85; }

    .walk-hint {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: max-content;
      max-width: 340px;
      background: rgba(17,17,17,0.02);
      backdrop-filter: blur(2.4px);
      -webkit-backdrop-filter: blur(2.4px);
      border: 0.96px solid rgba(17,17,17,0.3);
      border-radius: 44px;
      box-shadow: inset 0 3.379px 3.379px 0 rgba(255,255,255,0.25);
      padding: 13px 26px;
      text-align: center;
      font-family: 'Pretendard', sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: -0.04em;
      line-height: 1.4;
      color: #111111;
      transition: opacity 0.35s ease;
    }
    .walk-hint.hidden { opacity: 0; pointer-events: none; }
    /* ── CLOCKS SVG ── */
    #clocks-svg {
      position: absolute;
      top: 0; left: 0;
      width: 1920px;
      height: 1080px;
      overflow: visible;
    }

    /* 바늘 공통 — transform-origin은 (0,0) 고정, transition 없음 */
    .clock-hand {
      transform-origin: 0px 0px;
    }

    [id$="-second"] {
      transform-origin: 0px 0px;
    }

    /* 분침/시침 — 실시간으로 되돌아갈 때 부드러운 애니메이션 */
    [id$="-hour"],
    [id$="-minute"] {
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 드래그 중인 시계는 즉각 반응해야 하므로 transition 끔 */
    [id$="-hour"].dragging,
    [id$="-minute"].dragging {
      transition: none;
    }
  </style>
</head>

  <script>
    let uiScale = 1;
    function fitViewport() {
      uiScale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      document.getElementById('viewport-scale').style.transform = 'scale(' + uiScale + ')';
    }
    fitViewport();
    window.addEventListener('resize', fitViewport);

    function updateTime() {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      document.getElementById('nav-time').textContent = h + ':' + m + ' ' + ampm;
    }
    updateTime();
    setInterval(updateTime, 1000);

    /* ── 시계 설정 ── */
    const CLOCKS = [1, 2, 3, 4, 5];
    const CENTERS = {
      1: { x: 455.93,  y: 612.00  },
      2: { x: 439.81,  y: 868.00  },
      3: { x: 1108.31, y: 730.31  },
      4: { x: 1586.87, y: 444.40  },
      5: { x: 1631.81, y: 835.81  },
    };

    const IDS = [1, 2, 3, 4, 5];

    // 각 시계의 마지막 적용 각도(누적, normalize 안 됨) — 최단 경로 회전 계산용
    const lastHourDeg = {};
    const lastMinDeg = {};
    IDS.forEach(id => { lastHourDeg[id] = 0; lastMinDeg[id] = 0; });

    function shortestDeg(last, target) {
      // target(0~360)에 대해 last와 가장 가까운 등가 각도를 반환
      const lastMod = ((last % 360) + 360) % 360;
      let diff = target - lastMod;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;
      return last + diff;
    }

    let isDragging = false;
    let dragStartAngle = 0;
    let activeDragId = null;       // 현재 드래그 중인 시계 id
    let draggedMinDeg = null;      // 드래그로 설정된 분침 각도 (해당 시계만)

    function getAngle(cx, cy, px, py) {
      return Math.atan2(py - cy, px - cx) * (180 / Math.PI) + 90;
    }

    function normalizeDeg(deg) {
      return ((deg % 360) + 360) % 360;
    }

    function svgPoint(svg, clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      const scaleX = 1920 / rect.width;
      const scaleY = 1080 / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top)  * scaleY,
      };
    }
    /* ── 드래그: 프레스한 시계의 분침만 조절 ── */
    const svg = document.getElementById('clocks-svg');

    function startDrag(clientX, clientY) {
      const pt = svgPoint(svg, clientX, clientY);
      let minDist = Infinity;
      let nearestId = null;
      Object.entries(CENTERS).forEach(([id, c]) => {
        const dist = Math.hypot(pt.x - c.x, pt.y - c.y);
        if (dist < minDist) { minDist = dist; nearestId = parseInt(id); }
      });

      activeDragId = nearestId;
      const c = CENTERS[activeDragId];
      dragStartAngle = getAngle(c.x, c.y, pt.x, pt.y);

      // 드래그 시작 시점의 실제(실시간) 분침 각도(누적값 기준)를 시작점으로 사용
      draggedMinDeg = lastMinDeg[activeDragId];

      // 드래그 중에는 transition 제거 (즉각 반응)
      const mEl = document.getElementById(`clock-${activeDragId}-minute`);
      const hEl = document.getElementById(`clock-${activeDragId}-hour`);
      if (mEl) mEl.classList.add('dragging');
      if (hEl) hEl.classList.add('dragging');

      isDragging = true;
    }

    function moveDrag(clientX, clientY) {
      if (!isDragging || activeDragId === null) return;
      const pt = svgPoint(svg, clientX, clientY);
      const c = CENTERS[activeDragId];
      const currentAngle = getAngle(c.x, c.y, pt.x, pt.y);
      let delta = currentAngle - dragStartAngle;
      if (delta > 180)  delta -= 360;
      if (delta < -180) delta += 360;

      draggedMinDeg = draggedMinDeg + delta;
      dragStartAngle = currentAngle; // 다음 move 때 누적되도록 갱신
      lastMinDeg[activeDragId] = draggedMinDeg;
      lastHourDeg[activeDragId] = draggedMinDeg / 12;

      // 드래그 중인 시계의 분침만 즉시 반영 (시침도 함께, 자연스러운 시계 동작)
      const m = document.getElementById(`clock-${activeDragId}-minute`);
      const h = document.getElementById(`clock-${activeDragId}-hour`);
      if (m) m.style.transform = `rotate(${draggedMinDeg}deg)`;
      if (h) {
        h.style.transform = `rotate(${draggedMinDeg / 12}deg)`;
      }
    }

    function endDrag() {
      // 놓는 순간 transition을 다시 켜서, 다음 updateHourMinute 때 부드럽게 복귀
      if (activeDragId !== null) {
        const mEl = document.getElementById(`clock-${activeDragId}-minute`);
        const hEl = document.getElementById(`clock-${activeDragId}-hour`);
        if (mEl) mEl.classList.remove('dragging');
        if (hEl) hEl.classList.remove('dragging');
      }
      isDragging = false;
      activeDragId = null;
      draggedMinDeg = null;
      // 놓는 즉시 실시간 값으로 부드럽게 복귀 시작
      updateHourMinute();
    }

    svg.addEventListener('mousedown', e => { startDrag(e.clientX, e.clientY); e.preventDefault(); });
    window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    svg.addEventListener('touchstart', e => { startDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
    window.addEventListener('touchmove', e => { if(isDragging) moveDrag(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    window.addEventListener('touchend', endDrag);

    /* ── 실시간 업데이트 ── */
    function updateHourMinute() {
      const now = new Date();
      const sec  = now.getSeconds() + now.getMilliseconds() / 1000;
      const min  = now.getMinutes() + sec / 60;
      const hour = (now.getHours() % 12) + min / 60;
      const minDeg  = normalizeDeg(min  * 6);
      const hourDeg = normalizeDeg(hour * 30);

      IDS.forEach(id => {
        // 현재 드래그 중인 시계는 실시간 업데이트 건너뜀 (드래그 핸들러가 직접 제어)
        if (isDragging && id === activeDragId) return;
        const h = document.getElementById(`clock-${id}-hour`);
        const m = document.getElementById(`clock-${id}-minute`);
        const newHourDeg = shortestDeg(lastHourDeg[id], hourDeg);
        const newMinDeg  = shortestDeg(lastMinDeg[id], minDeg);
        lastHourDeg[id] = newHourDeg;
        lastMinDeg[id] = newMinDeg;
        if (h) h.style.transform = `rotate(${newHourDeg}deg)`;
        if (m) m.style.transform = `rotate(${newMinDeg}deg)`;
      });
      updateTime();
    }

    function updateSeconds() {
      const now = new Date();
      const sec = now.getSeconds() + now.getMilliseconds() / 1000;
      const secDeg = sec * 6;
      IDS.forEach(id => {
        const s = document.getElementById(`clock-${id}-second`);
        if (s) s.style.transform = `rotate(${secDeg}deg)`;
      });
      requestAnimationFrame(updateSeconds);
    }

    updateHourMinute();
    setInterval(updateHourMinute, 1000);
    requestAnimationFrame(updateSeconds);

    let isOpen = false;

    function toggleNav() {
      isOpen ? closeNav() : openNav();
    }

    function openNav() {
      isOpen = true;
      document.getElementById('nav-pill').classList.add('open');
      document.getElementById('nav-overlay').classList.add('open');
    }

    function closeNav() {
      isOpen = false;
      document.getElementById('nav-pill').classList.remove('open');
      document.getElementById('nav-overlay').classList.remove('open');
    }

    function navGo(name) {
      closeNav();
      showPage(name);
    }

    const preview = document.getElementById('nav-preview');
    const previewImg = document.getElementById('nav-preview-img');
    const navBody = document.querySelector('.nav-body');

    document.querySelectorAll('.nav-menu-item[data-thumb]').forEach(item => {
      item.addEventListener('mouseenter', function() {
        const itemRect = this.getBoundingClientRect();
        const bodyRect = navBody.getBoundingClientRect();
        previewImg.src = this.dataset.thumb;
        preview.style.top = (itemRect.bottom - bodyRect.top - 60) + 'px';
        preview.classList.add('visible');
      });
      item.addEventListener('mouseleave', function() {
        preview.classList.remove('visible');
      });
    });

    function showPage(name) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('contact-btn').classList.remove('active');
      const t = document.getElementById('page-' + name);
      if (t) t.classList.add('active');
      if (name === 'contact') document.getElementById('contact-btn').classList.add('active');
      if (name === 'walk') resetWalkGame();
    }

    /* ── TAKE A WALK — MAZE GAME ── */
    const WALK = { cols: 16, rows: 7, cellSize: 95, entranceRow: 1, exitRow: 5, threshold: 15 };
    const walkState = { segments: [], active: false, over: false, lastPaw: null, pawSide: 1 };

    function generateMazeGrid(cols, rows) {
      const cells = [];
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) row.push({ top: true, right: true, bottom: true, left: true, visited: false });
        cells.push(row);
      }
      const dirs = [
        { dc: 0, dr: -1, self: 'top', opp: 'bottom' },
        { dc: 1, dr: 0, self: 'right', opp: 'left' },
        { dc: 0, dr: 1, self: 'bottom', opp: 'top' },
        { dc: -1, dr: 0, self: 'left', opp: 'right' },
      ];
      const stack = [{ c: 0, r: 0 }];
      cells[0][0].visited = true;
      while (stack.length) {
        const { c, r } = stack[stack.length - 1];
        const neighbors = [];
        for (const d of dirs) {
          const nc = c + d.dc, nr = r + d.dr;
          if (nc >= 0 && nc < cols && nr >= 0 && nr < rows && !cells[nr][nc].visited) neighbors.push({ nc, nr, d });
        }
        if (!neighbors.length) { stack.pop(); continue; }
        const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
        cells[r][c][pick.d.self] = false;
        cells[pick.nr][pick.nc][pick.d.opp] = false;
        cells[pick.nr][pick.nc].visited = true;
        stack.push({ c: pick.nc, r: pick.nr });
      }
      return cells;
    }

    function buildMaze() {
      const { cols, rows, cellSize, entranceRow, exitRow } = WALK;
      const grid = generateMazeGrid(cols, rows);
      const segments = [];
      const canvas = document.getElementById('maze-canvas');
      const width = cols * cellSize, height = rows * cellSize;
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 2;
      ctx.lineCap = 'square';

      function line(x1, y1, x2, y2) {
        segments.push({ x1, y1, x2, y2 });
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = grid[r][c];
          const x = c * cellSize, y = r * cellSize;
          if (cell.top) line(x, y, x + cellSize, y);
          if (cell.left && !(c === 0 && r === entranceRow)) line(x, y, x, y + cellSize);
          if (c === cols - 1 && cell.right && r !== exitRow) line(x + cellSize, y, x + cellSize, y + cellSize);
          if (r === rows - 1 && cell.bottom) line(x, y + cellSize, x + cellSize, y + cellSize);
        }
      }

      /* invisible guard rails so players can't sneak around the top/bottom of the whole stage */
      segments.push({ x1: -300, y1: 0, x2: width + 300, y2: 0 });
      segments.push({ x1: -300, y1: height, x2: width + 300, y2: height });

      document.getElementById('walk-start').style.top = (entranceRow * cellSize + cellSize / 2) + 'px';
      document.getElementById('walk-end').style.top = (exitRow * cellSize + cellSize / 2) + 'px';

      return segments;
    }

    function distToSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1, dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      let t = lenSq === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    function isColliding(mx, my) {
      for (const s of walkState.segments) {
        if (distToSegment(mx, my, s.x1, s.y1, s.x2, s.y2) < WALK.threshold) return true;
      }
      return false;
    }

    function spawnPaw(x, y, angleDeg) {
      const el = document.createElement('div');
      el.className = 'paw';
      walkState.pawSide *= -1;
      const rad = angleDeg * Math.PI / 180;
      const perpRad = (angleDeg + 90) * Math.PI / 180;
      const forward = 10; // lead the footprint slightly ahead of the cursor, in the direction of travel
      const side = 6 * walkState.pawSide;
      const ox = x + Math.cos(rad) * forward + Math.cos(perpRad) * side;
      const oy = y + Math.sin(rad) * forward + Math.sin(perpRad) * side;
      el.style.left = ox + 'px';
      el.style.top = oy + 'px';
      /* the paw artwork's toes naturally point ~20deg above the pad-to-toe
         axis at rest, so add that offset to align the toes with travel direction */
      el.style.transform = 'rotate(' + (angleDeg + 20) + 'deg)';
      el.innerHTML = '<img src="img/paw-icon.svg" alt="" />';
      document.getElementById('walk-footprints').appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }

    function handleWalkMove(e) {
      if (!walkState.active || walkState.over) return;
      const canvas = document.getElementById('maze-canvas');
      const rect = canvas.getBoundingClientRect();
      /* rect is in post-transform screen space, but the canvas' own pixel
         buffer (and everything else in .viewport-scale) is laid out in the
         untransformed 1920×1080 design space — divide by uiScale to match */
      const mx = (e.clientX - rect.left) / uiScale;
      const my = (e.clientY - rect.top) / uiScale;

      const exitTop = WALK.exitRow * WALK.cellSize;
      const exitBottom = exitTop + WALK.cellSize;
      if (mx > canvas.width && my > exitTop && my < exitBottom) {
        winWalkGame();
        return;
      }

      /* interpolate between the last sampled point and this one so fast
         mouse movement can't skip through a wall between two mousemove events */
      const prev = walkState.lastPos || { x: mx, y: my };
      const dist = Math.hypot(mx - prev.x, my - prev.y);
      const steps = Math.max(1, Math.ceil(dist / 6));
      for (let i = 1; i <= steps; i++) {
        const px = prev.x + ((mx - prev.x) * i) / steps;
        const py = prev.y + ((my - prev.y) * i) / steps;
        if (isColliding(px, py)) {
          gameOverWalk();
          return;
        }
      }
      walkState.lastPos = { x: mx, y: my };

      if (!walkState.lastPaw || Math.hypot(mx - walkState.lastPaw.x, my - walkState.lastPaw.y) > 22) {
        let angle = 0;
        if (walkState.lastPaw) angle = Math.atan2(my - walkState.lastPaw.y, mx - walkState.lastPaw.x) * 180 / Math.PI;
        spawnPaw(mx, my, angle);
        walkState.lastPaw = { x: mx, y: my };
      }
    }

    function startWalkGame() {
      walkState.active = true;
      walkState.over = false;
      walkState.lastPaw = null;
      walkState.lastPos = null;
      document.getElementById('walk-start').classList.add('hidden');
      document.querySelector('.walk-hint').classList.add('hidden');
    }

    function showWalkOverlay(message) {
      walkState.active = false;
      walkState.over = true;
      const overlay = document.getElementById('walk-overlay');
      document.getElementById('walk-overlay-msg').textContent = message;
      overlay.classList.add('show');
    }

    function gameOverWalk() { showWalkOverlay('Game Over 🐾'); }
    function winWalkGame() { showWalkOverlay('산책 완료! 🐾'); }

    function resetWalkGame() {
      walkState.segments = buildMaze();
      walkState.active = false;
      walkState.over = false;
      walkState.lastPaw = null;
      walkState.lastPos = null;
      document.getElementById('walk-start').classList.remove('hidden');
      document.getElementById('walk-overlay').classList.remove('show');
      document.getElementById('walk-footprints').innerHTML = '';
      document.querySelector('.walk-hint').classList.remove('hidden');
    }

    document.getElementById('walk-start-btn').addEventListener('click', startWalkGame);
    document.getElementById('walk-retry').addEventListener('click', resetWalkGame);
    document.getElementById('maze-wrap').addEventListener('mousemove', handleWalkMove);

    if (location.hash === '#contact') showPage('contact');
  </script>
</body>
</html>
