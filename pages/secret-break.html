<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret Break · Playtime!</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/secret-break.css" />
</head>
<body>

  <div class="viewport-scale-outer">
  <div class="sb-loading-bg" id="sb-loading-bg"></div>
  <div class="viewport-scale" id="viewport-scale">

    <a class="site-logo" href="../index.html">
      <img src="../img/logo.svg" alt="Playtime!" />
    </a>

    <div class="nav-overlay" id="nav-overlay" onclick="closeNav()"></div>

    <div class="nav-pill" id="nav-pill">
      <div class="nav-top" onclick="toggleNav()">
        <div class="nav-top-closed">
          <span class="nav-label">Time</span>
          <span class="nav-time" id="nav-time">12:00 AM</span>
        </div>
        <div class="nav-top-open">
          <span class="nav-label">Time</span>
          <span class="nav-close" onclick="event.stopPropagation(); closeNav()">Close</span>
        </div>
      </div>

      <div class="nav-body">
        <nav class="nav-menu">
          <a class="nav-menu-item" href="washup.html">Wash Up</a>
          <a class="nav-menu-item" href="#">Lunch Time</a>
          <a class="nav-menu-item" aria-current="page">Secret Break</a>
          <a class="nav-menu-item" href="take-a-walk.html">Take A Walk</a>
          <a class="nav-menu-item" href="drawing.html">Drawing</a>
          <a class="nav-menu-item" href="ready-for-sleep.html">Ready For Sleep</a>
        </nav>

        <div class="nav-footer">
          <span class="nav-copyright">©Labvoid</span>
          <div class="nav-icons">
            <a class="nav-icon-link" href="#" target="_blank">
              <img src="../img/insta.svg" alt="Instagram" />
            </a>
            <a class="nav-icon-link" href="#" target="_blank">
              <img src="../img/behance.svg" alt="Behance" />
            </a>
          </div>
        </div>
      </div>
    </div>

    <a class="contact-btn" id="contact-btn" href="../index.html#contact">
      <span class="contact-dot"></span>
      <span class="contact-label">Contact</span>
    </a>

    <!-- 준비중 (로딩) -->
    <div class="sb-loading" id="sb-loading">
      <p class="sb-loading-title">Secret break</p>
      <p class="sb-loading-sub">월루 중인 직장인들 사이 빈 화장실 칸을 찾아보세요!</p>
      <div class="sb-loading-char">
        <img class="sb-mascot-img" src="../public/assets/secret-break/mascot.svg" alt="" />
        <div class="sb-bubble sb-bubble--loading">
          <img class="sb-bubble-bg" src="../public/assets/secret-break/speech-bubble-loading.svg" alt="" />
          <span class="sb-bubble-text">주가가 이게 뭐야~</span>
        </div>
      </div>
      <p class="sb-loading-label">Loading <span class="sb-loading-dots" id="sb-loading-dots">.</span></p>
      <div class="sb-loading-tip">Tip. 급하다고 아무거나 고르면 큰일 날지도 몰라요</div>
    </div>

    <main class="sb-root">

    <!-- SCREEN: 게임 -->
    <section class="sb-screen sb-screen--game active" id="sb-screen-game">
      <p class="sb-title">Secret break</p>
      <div class="sb-level-badge" id="sb-level-badge">Lv.1</div>

      <div class="sb-game-area" id="sb-game-area">
        <div class="sb-wall sb-wall--left"></div>
        <div class="sb-wall sb-wall--mid1"></div>
        <div class="sb-wall sb-wall--mid2"></div>
        <div class="sb-wall sb-wall--right"></div>
        <div class="sb-topbar"></div>
        <div class="sb-shadow sb-shadow--left"></div>
        <div class="sb-shadow sb-shadow--mid1"></div>
        <div class="sb-shadow sb-shadow--mid2"></div>
        <div class="sb-shadow sb-shadow--right"></div>

        <div class="sb-slot" id="sb-slot-0"></div>
        <div class="sb-slot" id="sb-slot-1"></div>
        <div class="sb-slot" id="sb-slot-2"></div>

        <div class="sb-door-group" id="sb-door-group-0">
          <img class="sb-hidden-content" id="sb-content-0" alt="" />
          <button type="button" class="sb-door" id="sb-door-0" aria-label="첫 번째 칸">
            <img class="sb-door-panel" id="sb-door-panel-0" alt="" />
          </button>
        </div>
        <div class="sb-door-group" id="sb-door-group-1">
          <img class="sb-hidden-content" id="sb-content-1" alt="" />
          <button type="button" class="sb-door" id="sb-door-1" aria-label="두 번째 칸">
            <img class="sb-door-panel" id="sb-door-panel-1" alt="" />
          </button>
        </div>
        <div class="sb-door-group" id="sb-door-group-2">
          <img class="sb-hidden-content" id="sb-content-2" alt="" />
          <button type="button" class="sb-door" id="sb-door-2" aria-label="세 번째 칸">
            <img class="sb-door-panel" id="sb-door-panel-2" alt="" />
          </button>
        </div>

        <div class="sb-bubble sb-bubble--game" id="sb-game-bubble" hidden>
          <img class="sb-bubble-bg" src="../public/assets/secret-break/speech-bubble.svg" alt="" />
          <span class="sb-bubble-text" id="sb-game-bubble-text"></span>
        </div>
      </div>

      <p class="sb-sr-status" id="sb-status" role="status" aria-live="polite"></p>
    </section>

    </main>

  </div>
  </div>

  <div class="sb-popup-overlay" id="sb-popup-overlay" hidden>
    <div class="sb-popup">
      <p class="sb-popup-title" id="sb-popup-title"></p>
      <p class="sb-popup-sub" id="sb-popup-sub"></p>
      <img class="sb-mascot-img sb-mascot-img--small" src="../public/assets/secret-break/mascot.svg" alt="" />
      <div class="sb-popup-actions">
        <button type="button" class="sb-popup-btn" onclick="sbQuit()">그만하기</button>
        <button type="button" class="sb-popup-btn sb-popup-btn--primary" onclick="sbRetry()">다시하기</button>
      </div>
    </div>
  </div>

  <script src="../js/secret-break.js"></script>
</body>
</html>
